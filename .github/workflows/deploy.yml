name: Deploy to Yandex Cloud Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync site to bucket
        run: |
          aws s3 sync . "s3://${{ secrets.YC_BUCKET_NAME }}" \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "LICENSE" \
            --cache-control "max-age=3600"

      - name: Verify deploy
        run: |
          aws s3 ls "s3://${{ secrets.YC_BUCKET_NAME }}" \
            --endpoint-url https://storage.yandexcloud.net \
            --recursive | head -20
