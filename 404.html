<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ProMakers</title>
  <meta name="description" content="Страница не найдена" id="meta-description">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="error">
    <a href="index.html" class="logo error__logo" aria-label="ProMakers — home">
      <span class="logo__mark logo__mark--lg"><img src="assets/img/logo-full.png" alt="ProMakers logo" width="815" height="715"></span>
    </a>

    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Язык / 语言">
      <button type="button" class="lang-switch__btn is-active" data-lang="ru">RU</button>
      <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
      <button type="button" class="lang-switch__btn" data-lang="zh">中文</button>
    </div>

    <div class="error__code">404</div>
    <h1 class="error__title" data-i18n="error.title">Страница не найдена</h1>
    <p class="error__text" data-i18n="error.text">
      Похоже, страница, которую вы ищете, была перемещена или удалена.
      Вернитесь на главную — там всё самое важное.
    </p>
    <div class="error__actions">
      <a href="index.html" class="btn btn--primary" data-i18n="error.home">На главную</a>
      <a href="mailto:hello@promakers.pro" class="btn btn--ghost" data-i18n="error.support">Написать в поддержку</a>
    </div>
  </main>

  <script>
    /* Локальный словарь страницы ошибки (полный словарь — в assets/js/i18n.js) */
    const I18N = {
      ru: {
        "error.title": "Страница не найдена",
        "error.text": "Похоже, страница, которую вы ищете, была перемещена или удалена. Вернитесь на главную — там всё самое важное.",
        "error.home": "На главную",
        "error.support": "Написать в поддержку",
        "_meta.title": "404 — Страница не найдена | ProMakers"
      },
      en: {
        "error.title": "Page not found",
        "error.text": "The page you are looking for may have been moved or deleted. Head back to the home page — everything important is there.",
        "error.home": "Back to home",
        "error.support": "Contact support",
        "_meta.title": "404 — Page not found | ProMakers"
      },
      zh: {
        "error.title": "页面未找到",
        "error.text": "您访问的页面可能已被移动或删除。返回首页，重要内容都在那里。",
        "error.home": "返回首页",
        "error.support": "联系支持",
        "_meta.title": "404 — 页面未找到 | ProMakers"
      }
    };

    const SUPPORTED = ["ru", "en", "zh"];
    const STORAGE_KEY = "promakers-lang";

    function detect() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && SUPPORTED.includes(saved)) return saved;
      const nav = (navigator.language || "ru").slice(0, 2).toLowerCase();
      return SUPPORTED.includes(nav) ? nav : "ru";
    }

    function apply(lang) {
      const dict = I18N[lang] || I18N.ru;
      document.documentElement.lang = lang;
      document.title = dict["_meta.title"];
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });
      document.querySelectorAll(".lang-switch__btn").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.lang === lang);
      });
      localStorage.setItem(STORAGE_KEY, lang);
    }

    document.querySelectorAll(".lang-switch__btn").forEach((btn) => {
      btn.addEventListener("click", () => apply(btn.dataset.lang));
    });
    apply(detect());
  </script>
</body>
</html>
